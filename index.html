<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeadShot — семья на NOVA</title>
  <meta name="description" content="HeadShot — семья GTA V RP на NOVA. Состав, хроника и вступление.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#" aria-label="HeadShot — главная">HeadShot</a>
    <nav aria-label="Основное меню">
      <a href="#family">Состав</a>
      <a href="#chronicle">Хроника</a>
      <a href="#join">Набор</a>
    </nav>
    <a href="#join" class="quiet-button">Вступить в семью ↗</a>
  </header>
  <main>
    <section class="hero" aria-label="HeadShot на NOVA">
      <div class="petals" aria-hidden="true"></div>
      <div class="hero-content">
        <h1>HeadShot</h1>
        <p class="hero-subtitle">GTA V RP · NOVA</p>
        <a class="button" href="#family">Смотреть состав <span aria-hidden="true">→</span></a>
      </div>
    </section>
    <section class="section" id="family">
      <h2>За именем — люди</h2>
      <div class="portraits">
        <div class="photo" role="img" aria-label="Персонаж в чёрном худи"></div>
        <div class="photo" role="img" aria-label="Персонаж в бордовой куртке"></div>
        <div class="photo" role="img" aria-label="Персонаж в кепке"></div>
        <div class="photo" role="img" aria-label="Персонаж в чёрной куртке"></div>
      </div>
    </section>
    <section class="section chronicle" id="chronicle">
      <h2>В кадре — HeadShot</h2>
      <button class="story-photo" id="open-photo" aria-label="Открыть изображение семьи">
        <img src="family.png" alt="Четыре персонажа на фоне вечернего Лос-Сантоса" loading="lazy">
      </button>
    </section>
    <section class="section join" id="join">
      <h2>Твой следующий<br>выход — с нами</h2>
      <form id="application">
        <label>Ник персонажа
          <input name="nickname" autocomplete="off" maxlength="80" required>
        </label>
        <label>Discord
          <input name="discord" autocomplete="off" maxlength="80" required>
        </label>
        <label>О себе
          <textarea name="about" maxlength="1500" required></textarea>
        </label>
        <button class="button" type="submit">Подготовить заявку <span aria-hidden="true">↗</span></button>
        <div id="output" hidden>
          <label>Текст заявки<textarea id="result" readonly></textarea></label>
          <button class="quiet-button" type="button" id="copy">Скопировать</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <footer><a class="logo" href="#">HeadShot</a><a href="#" aria-label="Вернуться наверх">Наверх ↑</a></footer>
  <dialog id="photo">
    <button id="close-photo" aria-label="Закрыть изображение">Закрыть ×</button>
    <img src="family.png" alt="Портрет семьи HeadShot">
  </dialog>
</body>
</html>
